name: Run Robot Framework Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *" # Run every hour at 47 minutes past the hour
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Python and UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.12'

      - name: Run Robot Framework tests
        run: |
          uv run robot --xunit report.xunit tests
        continue-on-error: true
      - name: Upload Robot Framework Test Report
        uses: actions/upload-artifact@v7
        with:
          name: robot-framework-report
          path: .

  report:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - name: Download Robot Framework Test Report
        uses: actions/download-artifact@v8
        with:
          name: robot-framework-report
          path: .
      - name: Upload Robot Framework Test Report GH
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: **/report.xunit